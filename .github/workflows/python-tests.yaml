name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest

  render-vignette:
    runs-on: ubuntu-latest
    # Only run on push; PRs from forks lack the write access required to commit back.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: quarto render docs/vignette.qmd --to html
      - name: Commit rendered vignette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/vignette.html docs/vignette_files/
          git diff --cached --quiet || git commit -m "Auto-render vignette [skip ci]"
          git push
